<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discrete Development – Preview Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05060a;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      max-width: 360px;
      width: 100%;
      padding: 32px 28px;
      background: #0b0d14;
      border-radius: 12px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6);
      border: 1px solid #222633;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ca3ff;
    }
    p {
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 1.5;
      color: #c7c9d6;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #e5e7f0;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px 11px;
      border-radius: 8px;
      border: 1px solid #3b4257;
      background: #05060a;
      color: #f5f5f5;
      font-size: 14px;
      outline: none;
    }
    input[type="password"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 1px #6366f1;
    }
    button {
      margin-top: 14px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: #6366f1;
      color: #f9fafb;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #4f46e5;
    }
    .error {
      margin-top: 10px;
      font-size: 13px;
      color: #f97373;
      min-height: 18px;
    }
    .tagline {
      margin-top: 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Preview Gate</h1>
    <p>This Discrete Development preview environment is access‑controlled. Enter the preview password to continue.</p>
    <form id="gate-form">
      <label for="pw">Preview password</label>
      <input id="pw" type="password" autocomplete="current-password" />
      <button type="submit">Enter preview</button>
      <div id="error" class="error"></div>
      <div class="tagline">Not for public use</div>
    </form>
  </div>
  <script src="gate.js"></script>
</body>
</html>
